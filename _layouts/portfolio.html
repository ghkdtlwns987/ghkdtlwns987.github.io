---
layout: default
---
<div class="post-layout{% if page.anonymous %} post-layout--anonymous{% endif %}">
  <article class="post portfolio-article" id="post-article">
    <header class="post-header">
      {% unless page.anonymous %}
      <nav class="poster-breadcrumb" aria-label="Breadcrumb">
        <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
        <span class="poster-breadcrumb-sep" aria-hidden="true">/</span>
        <span class="poster-breadcrumb-current">{{ page.title }}</span>
      </nav>
      {% endunless %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="portfolio-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    <div class="post-content" id="post-content">
      {{ content }}
    </div>
  </article>

  {% unless page.anonymous %}
  <div class="post-side-rail">
    {% include content-topbar.html %}
    <aside class="post-toc page-rail" id="post-toc" aria-label="Contents" hidden>
      <details class="post-toc-details" id="post-toc-details" open>
        <summary class="post-toc-title">Contents</summary>
        <nav class="post-toc-nav" id="post-toc-nav">
          <ul class="post-toc-list" id="post-toc-list"></ul>
        </nav>
      </details>
    </aside>
  </div>
  {% endunless %}
</div>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="window.__katexReady=true"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" crossorigin="anonymous"
  onload="window.__mermaidReady=true"></script>
<script defer src="{{ '/assets/js/post-enhance.js' | relative_url }}?v=3"></script>
<script defer src="{{ '/assets/js/code-copy.js' | relative_url }}?v=1"></script>
