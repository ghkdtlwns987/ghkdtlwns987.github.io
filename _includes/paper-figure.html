{% comment %}
  Paper figure. Params: src, caption, alt, width.
  Image path: assets/images/{src}
{% endcomment %}
<figure class="post-figure"{% if include.width %} style="max-width: {{ include.width }}px; margin-left: auto; margin-right: auto;"{% endif %}>
  <img
    src="{{ '/assets/images/' | append: include.src | relative_url }}"
    alt="{{ include.alt | default: include.caption | strip_html }}"
    {% if include.width %}width="{{ include.width }}"{% endif %}
    loading="lazy"
  >
  {% if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
