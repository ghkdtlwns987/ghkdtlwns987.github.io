international:
  - slug: clear-ase-2026
    cv: true
    featured: true
    headline: "CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection"
    title: "CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection"
    date: "2026.07.29"
    venue: "IEEE/ACM International Conference on Automated Software Engineering (ASE 2026)"
    authors: "Sungju Yun*, Sijune Hwang*, Yeonjoon Lee, Kyungtae Kang, Sungbin Park"
    badges:
      - type: intl
        label: International
      - type: venue
        label: ASE
      - type: year
        label: "2026"
      - type: author
        label: First Author
    news:
      date: "Aug 2026"
      featured: true
      text: |
        CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection has been accepted to
        IEEE/ACM International Conference on Automated Software Engineering (ASE 2026).
      badges:
        - New
        - Paper
      tags:
        - ASE
        - "2026"
    summary:
      - >
          소프트웨어 취약점의 복잡한 인과 관계를 구조화한 Vulnerability Causal Knowledge Graph (VCKG)와 LLM 기반 Multi-Agent Reasoning을 결합한 AI 기반 취약점 탐지 프레임워크를 제안하였습니다. 
          소프트웨어 취약점을 원인과 결과의 인과 관계로 모델링하여 그래프 형태의 보안 지식을 구축하고, LLM 추론과 결합한 새로운 접근법을 제시한 참신함을 인정받아, 본 연구는 IEEE/ACM International Conference on Automated Software Engineering (ASE 2026)에 채택되었습니다.
      - >
          본 연구에서는 Vulnerability Causal Knowledge Graph (VCKG)를 구축하고,
          다중 LLM 에이전트 기반 협력 추론을 통해 소프트웨어 취약점의 탐지와
          원인 분석을 수행합니다.
    link: "https://arxiv.org/abs/2608.03134"
    link_label: "arXiv"
    links:
      - label: arXiv
        url: "https://arxiv.org/abs/2608.03134"
      - label: Conference
        url: "https://conf.researchr.org/details/ase-2026/ase-2026-research-track/227/CLEAR-Causal-Context-Based-Agentic-Reasoning-for-Vulnerability-Detection"
      # - label: Code
      #   url: "https://github.com/..."
      # - label: Slides
      #   url: "https://..."
    image: /assets/images/papers/clear-og.png
    contributions:
      - Multi-Agent 기반 취약점 탐지 프레임워크 제안
      - Vulnerability Causal Knowledge Graph (VCKG) 설계
      - LLM 기반 Multi-Agent Reasoning을 통한 취약점 탐지 성능 향상
    figures:
      - src: figure/paper/clear1.png
        caption: CLEAR 프레임워크 개요
      - src: figure/paper/clear2.png
        caption: VCKG 및 Multi-Agent Reasoning 구조

journals:
  - slug: craft-tdsc-2026
    cv: true
    headline: "CRAFT: Causality-aware Reasoning and Adaptive Framework for Vulnerability Types"
    title: "CRAFT: Causality-aware Reasoning and Adaptive Framework for Vulnerability Types"
    date: "2026.08.31"
    venue: "IEEE Transactions on Dependable and Secure Computing (TDSC)"
    status: "Under Review"
    authors: "Sungju Yun*, Sijune Hwang*, Yeonjoon Lee, Kyungtae Kang, Sungbin Park"
    badges:
      - type: intl
        label: Journal
      - type: venue
        label: TDSC
      - type: year
        label: "2026"
      - type: author
        label: First Author
      - type: submitted
        label: Under Review
    news:
      date: "Aug 2026"
      text: |
        CRAFT: Causality-aware Reasoning and Adaptive Framework for Vulnerability Types has been submitted to
        IEEE Transactions on Dependable and Secure Computing (TDSC).
      badges:
        - Paper
      tags:
        - TDSC
        - "2026"
    summary:
      - >
          ASE 2026 CLEAR의 Journal Extension으로, 취약점 발생 메커니즘을 Causality Type으로 재분류하고
          Causality-Typed Vulnerability Knowledge Graph(CTVKG)와 유형별 Expert Agent를 결합한
          적응형 취약점 탐지 프레임워크를 제안하였습니다.
      - >
          모든 취약점을 하나의 인과 구조로 분석하던 CLEAR의 한계를 보완하기 위해,
          유형별 지식 표현과 Multi-Agent Reasoning을 분리 설계하고
          CLEAR 대비 Pairwise Correct Prediction(P-C) 상대 개선을 확인하였습니다.
    contributions:
      - Causality Type 기반 취약점 지식 표현(CTVKG) 설계
      - Causality-specific Expert Multi-Agent Reasoning
      - 독립 외부 Dataset 및 LLM Backbone에 대한 일반화·강건성 평가

